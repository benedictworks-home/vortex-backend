name: Container Smoke Tests

# Issue #491 — Per-arch container smoke tests
#
# Runs after every build on PRs and main pushes. Validates that the hardened
# distroless image:
#   1. Boots without a shell or package manager
#   2. Responds to /health/live (liveness probe)
#   3. Handles a minimal intent-creation flow (POST /api/v1/intents)
#
# Both amd64 and arm64 are tested. arm64 uses QEMU emulation via
# docker/setup-qemu-action because GitHub Actions standard runners are x86_64.
# The smoke test itself is lightweight (<60s) so QEMU overhead is acceptable.

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - prisma/schema.prisma
      - .github/workflows/container-smoke.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - prisma/schema.prisma

concurrency:
  group: container-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build the image once, export as a tarball ────────────────────────────────
  build:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    outputs:
      # Passed to smoke test jobs so they load the exact same tarball
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff9c9f7eb5ca85ccdb5 # v3.6.0
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Compute cache key
        id: cache-key
        run: echo "value=container-smoke-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build amd64 image and export
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: vortex-backend:smoke-amd64
          cache-from: type=gha,scope=smoke-amd64
          cache-to: type=gha,mode=max,scope=smoke-amd64
          build-args: |
            NODE_VERSION=20
            DISTROLESS_TAG=nodejs20-debian12

      - name: Save amd64 image tarball
        run: docker save vortex-backend:smoke-amd64 | gzip > /tmp/smoke-amd64.tar.gz

      - name: Upload amd64 tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-amd64
          path: /tmp/smoke-amd64.tar.gz
          retention-days: 1

      - name: Build arm64 image and export
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: false
          outputs: type=docker,dest=/tmp/smoke-arm64.tar.gz
          tags: vortex-backend:smoke-arm64
          cache-from: type=gha,scope=smoke-arm64
          cache-to: type=gha,mode=max,scope=smoke-arm64
          build-args: |
            NODE_VERSION=20
            DISTROLESS_TAG=nodejs20-debian12

      - name: Upload arm64 tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-arm64
          path: /tmp/smoke-arm64.tar.gz
          retention-days: 1

  # ── Trivy CVE gate ────────────────────────────────────────────────────────────
  trivy:
    name: Trivy CVE scan (amd64)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Download amd64 tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-amd64
          path: /tmp

      - name: Load image
        run: docker load < /tmp/smoke-amd64.tar.gz

      - name: Run Trivy — fail on HIGH/CRITICAL with a fix available
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # v0.30.0
        with:
          image-ref: vortex-backend:smoke-amd64
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          # Allow 5 minutes before timing out
          timeout: 5m0s

      - name: Run Trivy — SARIF upload (informational, all severities)
        if: always()
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # v0.30.0
        with:
          image-ref: vortex-backend:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: false
          vuln-type: os,library
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  # ── amd64 smoke test ──────────────────────────────────────────────────────────
  smoke-amd64:
    name: Smoke test — linux/amd64
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Download amd64 tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-amd64
          path: /tmp

      - name: Load amd64 image
        run: docker load < /tmp/smoke-amd64.tar.gz

      - name: Run smoke test (amd64)
        env:
          ARCH: amd64
          IMAGE: vortex-backend:smoke-amd64
          DATABASE_URL: postgresql://vortex:vortex@localhost:5432/vortex?schema=public
          REDIS_URL: redis://localhost:6379
        run: bash scripts/ci/container-smoke-test.sh

  # ── arm64 smoke test ──────────────────────────────────────────────────────────
  smoke-arm64:
    name: Smoke test — linux/arm64 (QEMU)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff9c9f7eb5ca85ccdb5 # v3.6.0
        with:
          platforms: linux/arm64

      - name: Download arm64 tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-arm64
          path: /tmp

      - name: Load arm64 image
        run: docker load < /tmp/smoke-arm64.tar.gz

      - name: Run smoke test (arm64)
        env:
          ARCH: arm64
          IMAGE: vortex-backend:smoke-arm64
          DATABASE_URL: postgresql://vortex:vortex@localhost:5432/vortex?schema=public
          REDIS_URL: redis://localhost:6379
        run: bash scripts/ci/container-smoke-test.sh
